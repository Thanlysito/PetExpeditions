# Mensajes de PetExpeditions (formato MiniMessage: https://docs.advntr.dev/minimessage/format.html)

prefix: "<gold><bold>Expediciones</bold></gold> <dark_gray>»</dark_gray> "

players-only: "<red>Solo los jugadores pueden usar esto."
no-permission: "<red>No tienes permiso."
reloaded: "<green>PetExpeditions recargado (<white><count></white> expediciones)."
help:
  - "<gold><bold>Expediciones de mascotas</bold>"
  - "<gray>1. <white>Shift + clic derecho</white> a tu lobo, gato o loro domesticado (mano vacía) para registrarlo."
  - "<gray>2. <white>/expeditions</white> - elige una expedición y una mascota."
  - "<gray>3. Vuelve más tarde y reclama el botín. ¡Las mascotas suben de nivel!"
  - "<gray>Otros: <white>/expeditions pets</white>, <white>/expeditions claim</white>"

pet-type:
  wolf: "Lobo"
  cat: "Gato"
  parrot: "Loro"

# --- registrar ---
