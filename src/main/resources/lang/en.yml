# PetExpeditions messages (MiniMessage format: https://docs.advntr.dev/minimessage/format.html)

prefix: "<gold><bold>Expeditions</bold></gold> <dark_gray>»</dark_gray> "

players-only: "<red>Only players can use this."
no-permission: "<red>You don't have permission."
reloaded: "<green>PetExpeditions reloaded (<white><count></white> expeditions)."
help:
  - "<gold><bold>Pet Expeditions</bold>"
  - "<gray>1. <white>Shift + right-click</white> your tamed wolf, cat or parrot (empty hand) to register it."
  - "<gray>2. <white>/expeditions</white> - pick an expedition and a pet."
  - "<gray>3. Come back later and claim the loot. Pets level up!"
  - "<gray>Other: <white>/expeditions pets</white>, <white>/expeditions claim</white>"

pet-type:
  wolf: "Wolf"
  cat: "Cat"
  parrot: "Parrot"

# --- registering ---
register-confirm: "<yellow>Shift + right-click again to add this pet to your expeditions. <gray>(it will leave the world until you take it out)"
registered: "<green><white><pet></white> joined your expedition team! <gray>Open it with <white>/expeditions"
register-not-owner: "<red>That pet isn't yours."
register-full: "<red>You already have the max of <white><max></white> pets."
released: "<green><white><pet></white> is back by your side."

# --- sending / claiming ---
sent: "<gray><white><pet></white> left for <expedition><gray>. Back in <white><time></white> <dark_gray>(<chance>% success)"
pet-busy: "<red><white><pet></white> is already on an expedition."
pet-busy-time: "<gray><white><pet></white> comes back in <white><time></white>."
pet-level-too-low: "<red><white><pet></white> needs level <white><level></white> for this expedition."
no-free-slots: "<red>You can only run <white><max></white> expeditions at the same time."
no-pets: "<red>You have no pets yet. <gray>Shift + right-click your tamed pet with an empty hand."
returned: "<green><white><pet></white> is back from <expedition><green>! <gray>Claim the loot with <white>/expeditions"
join-ready: "<green>You have <white><count></white> expedition(s) ready to claim! <gray>Use <white>/expeditions"
claim-success: "<green><white><pet></white> came back from <expedition> <green>with loot:"
claim-fail: "<red><white><pet></white> got lost in <expedition> <red>and came back empty-handed."
loot-line: "<gray>  + <white><amount>x</white> <item>"
loot-line-command: "<gray>  + <reward>"
loot-empty: "<gray>  (nothing this time)"
nothing-to-claim: "<gray>No expedition is ready yet."
expedition-removed: "<gray><white><pet></white> is back (that expedition no longer exists)."
xp-gained: "<aqua><pet> +<xp> XP"
level-up: "<gold><bold>LEVEL UP!</bold> <white><pet></white> is now level <white><level></white>."

# --- menus ---
menu-title-board: "<dark_gray>Expeditions"
menu-title-pick: "<dark_gray>Send a pet » <expedition>"
menu-title-pets: "<dark_gray>My pets"
menu-close: "<red>Close"
menu-back: "<yellow>Back"
menu-info: "<gold>How does it work?"
menu-info-lore:
  - "<gray>1. <white>Shift + right-click</white> <gray>your tamed"
  - "<gray>   wolf, cat or parrot with an empty hand."
  - "<gray>2. Pick an expedition and send a pet."
  - "<gray>3. Come back later and claim the loot."
  - ""
  - "<green>Synergy: <gray>pets of the right type get"
  - "<gray>more success and more loot."
  - "<aqua>Levels: <gray>every expedition gives XP."
menu-pets: "<yellow>My pets <gray>(<count>/<max>)"
menu-pets-lore: "<gray>Expeditions running: <white><active>/<slots>"
menu-claim-all: "<green>Claim all <gray>(<count>)"
menu-claim-all-lore: "<gray>Click to claim every finished expedition"
menu-claim-all-none: "<gray>Nothing to claim yet"
menu-no-pets: "<red>You have no pets yet"

exp-duration: "<gray>Duration: <white><time>"
exp-level: "<gray>Min. level: <white><level>"
exp-synergy: "<gray>Synergy: <green><type>"
exp-synergy-none: "<gray>Synergy: <dark_gray>none"
exp-chance: "<gray>Base success: <white><chance>%"
exp-xp: "<gray>Pet XP: <aqua>+<xp>"
exp-loot-title: "<gold>Possible loot:"
