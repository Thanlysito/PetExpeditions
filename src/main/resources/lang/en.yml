exp-loot-command: "<gray> • <reward> <dark_gray>(<chance>%)"
exp-click: "<yellow>Click to choose a pet"

pet-title: "<aqua><pet> <dark_gray>(<type>)"
pet-level: "<gray>Level <white><level></white> <bar> <dark_gray><xp>/<need> XP"
pet-level-max: "<gold>Level <level> (MAX)"
status-free: "<green>Available"
status-away: "<yellow>On <expedition> <gray>- back in <white><time>"
status-ready: "<green><bold>Back from</bold> <expedition><green>!"
pick-best: "<gold>★ Best choice"
pick-chance: "<gray>Success chance: <white><chance>%"
pick-synergy: "<green>✦ Synergy! More success and loot"
pick-level-low: "<red>Needs level <level>"
pick-click: "<yellow>Click to send"
pets-click-claim: "<green>Click to claim the loot"
pets-click-release: "<gray>Shift + click: take it out to the world"

# --- custom pets / eggs ---
rarity:
  common: "Common"
  rare: "Rare"
  epic: "Epic"
  legendary: "Legendary"
egg-name: "<pet> Egg"
